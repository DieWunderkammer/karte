  :root { --green:#2e7d32; --yellow:#f9a825; --gray:#757575; --red:#c62828; --bg:#fafafa; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; background:var(--bg); color:#222; }
  #app { display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 14px; background:#fff; border-bottom:1px solid #e0e0e0; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  header h1 { font-size:15px; margin:0; font-weight:600; flex:1 1 auto; }
  header .meta { font-size:11px; color:#666; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; padding:8px 14px; background:#fff; border-bottom:1px solid #e0e0e0; }
  .filter-btn { padding:6px 12px; border:1px solid #ccc; border-radius:16px; background:#fff; font-size:12px; cursor:pointer; user-select:none; display:inline-flex; align-items:center; gap:5px; }
  .filter-btn .dot { display:inline-block; width:10px; height:10px; border-radius:50%; }
  .filter-btn.active { background:#333; color:#fff; border-color:#333; }
  .filter-btn .count { opacity:0.7; font-size:11px; }
  #map { flex:1; width:100%; }
  .pin { border:2px solid #fff; border-radius:50% 50% 50% 0; width:28px; height:28px; transform:rotate(-45deg); box-shadow:0 2px 5px rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center; }
  .pin.green { background:var(--green); }
  .pin.yellow { background:var(--yellow); }
  .pin.gray { background:var(--gray); }
  .pin.red { background:var(--red); }
  .pin-label { transform:rotate(45deg); color:#fff; font-weight:700; font-size:12px; }
  .popup { min-width:240px; font-size:13px; line-height:1.45; }
  .popup .title { font-weight:600; font-size:14px; margin-bottom:6px; }
  .popup .status { display:inline-block; padding:2px 8px; border-radius:10px; color:#fff; font-size:11px; margin-bottom:8px; }
  .status.green { background:var(--green); } .status.yellow { background:var(--yellow); } .status.gray { background:var(--gray); } .status.red { background:var(--red); }
  .popup .field { margin:4px 0; }
  .popup .field b { color:#555; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; }
  .popup .navi { display:inline-block; margin-top:8px; padding:8px 14px; background:#1976d2; color:#fff; border-radius:6px; text-decoration:none; font-weight:500; font-size:13px; }
  .popup .navi:hover { background:#1565c0; }
  .popup .email { display:inline-block; margin-top:4px; padding:6px 10px; background:#f0f0f0; color:#333; border-radius:6px; text-decoration:none; font-size:12px; }
  @media (max-width:640px) { header h1 { font-size:14px; } .filter-btn { font-size:11px; padding:5px 10px; } }

const COLOR_LABELS = { green:"Abgeholt", yellow:"Offen", gray:"Kein Material", red:"Absage" };

const map = L.map('map', { zoomControl: true }).setView([49.5, 11.0], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap'
}).addTo(map);

function makeIcon(color) {
  return L.divIcon({
    className: '', iconSize: [28, 28], iconAnchor: [14, 28], popupAnchor: [0, -28],
    html: `<div class="pin ${color}"></div>`
  });
}

function esc(s) { return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function popupHtml(s) {
  const naviUrl = `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}&destination_place_id=${encodeURIComponent(s.name + ', ' + s.ort)}`;
  let html = `<div class="popup">`;
  html += `<div class="title">${esc(s.name)}</div>`;
  html += `<span class="status ${s.color}">${esc(s.status)}</span>`;
  html += `<div class="field"><b>Ort</b><br>${esc(s.ort)}</div>`;
  if (s.kontakt) html += `<div class="field"><b>Kontakt</b><br>${esc(s.kontakt)}</div>`;
  if (s.material) html += `<div class="field"><b>Material</b><br>${esc(s.material)}</div>`;
  html += `<a class="navi" href="${naviUrl}" target="_blank" rel="noopener">🧭 Navi starten</a>`;
  if (s.email) html += ` <a class="email" href="mailto:${esc(s.email)}">✉️ Email</a>`;
  html += `</div>`;
  return html;
}

const layers = { green:[], yellow:[], gray:[], red:[] };
DATA.schools.forEach(s => {
  const m = L.marker([s.lat, s.lng], { icon: makeIcon(s.color) }).bindPopup(popupHtml(s));
  layers[s.color].push(m);
  m.addTo(map);
});

const filters = document.getElementById('filters');
const counts = { green:0, yellow:0, gray:0, red:0 };
DATA.schools.forEach(s => counts[s.color]++);

const state = { green:true, yellow:true, gray:true, red:true };

function renderFilters() {
  filters.innerHTML = '';
  Object.keys(COLOR_LABELS).forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (state[c] ? ' active' : '');
    btn.innerHTML = `<span class="dot" style="background:var(--${c==='green'?'green':c==='yellow'?'yellow':c==='gray'?'gray':'red'})"></span> ${COLOR_LABELS[c]} <span class="count">(${counts[c]})</span>`;
    btn.onclick = () => {
      state[c] = !state[c];
      layers[c].forEach(m => state[c] ? m.addTo(map) : map.removeLayer(m));
      renderFilters();
    };
    filters.appendChild(btn);
  });
}
renderFilters();

document.getElementById('meta').textContent = `${DATA.schools.length} Schulen · Stand ${DATA.lastUpdate}`;

if (DATA.schools.length) {
  const group = L.featureGroup(Object.values(layers).flat());
  map.fitBounds(group.getBounds().pad(0.1));
}
